<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiki Tiki Gank</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px Arial;background:#09090f;color:#fff}
nav{padding:18px 7%;background:#14141c;display:flex;justify-content:space-between}
.gold{color:#ffd43b}nav a{color:#aaa;text-decoration:none}
.hero{text-align:center;padding:105px 20px;background:radial-gradient(circle,#6939d8,#09090f 65%)}
h1{font-size:clamp(3rem,9vw,7rem);margin:0}.section{max-width:900px;margin:auto;padding:65px 20px;text-align:center}
.big{font-size:clamp(4rem,11vw,8rem);font-weight:bold;color:#ffd43b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#181821;padding:25px;border-radius:18px}
.card h3{color:#ffd43b}.btn{background:#ffd43b;border:0;border-radius:99px;padding:14px 24px;font-weight:bold;cursor:pointer}
.btn.loading{opacity:.72;cursor:wait;pointer-events:none}.form{max-width:550px;margin:auto;text-align:left}
.form input{width:100%;padding:13px;margin:7px 0 15px;background:#111;color:white;border:1px solid #444;border-radius:8px}
.form .btn{width:100%}.msg{text-align:center;min-height:24px}.tabs{display:flex;gap:10px;margin-bottom:20px}.tabs button{flex:1}
.hidden{display:none}.spinner{display:inline-flex;gap:5px;margin-right:8px;vertical-align:middle}
.spinner i{width:7px;height:7px;background:#111;border-radius:50%;animation:dot 1s infinite}
.spinner i:nth-child(2){animation-delay:.15s}.spinner i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,70%,100%{transform:scale(.55);opacity:.45}35%{transform:scale(1);opacity:1}}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><b class="gold">🔥 TIKI TIKI GANK</b><div><a href="/member.html">Member</a> &nbsp; <a href="/admin.html">Host Admin</a></div></nav>
<section class="hero"><h1>TIKI TIKI <span class="gold">GANK</span></h1><p id="intro"></p><button class="btn" onclick="joinbox.scrollIntoView()">JOIN SEKARANG 🔥</button></section>
<section class="section"><h2>Our Community</h2><div class="big">25,000,000+</div><p>Followers worldwide 🌎</p></section>
<section class="section"><h2>👑 Hosts</h2><div class="grid">
<div class="card"><h3>Richard Harris Phang</h3><p>Host</p></div>
<div class="card"><h3>Jason Vilbert</h3><p>Host</p></div>
<div class="card"><h3>Kenward Alvaro Viryatandi</h3><p>Host</p></div>
</div></section>

<section class="section" id="joinbox"><h2>Join / Login</h2>
<div class="tabs"><button class="btn" onclick="showTab('join')">JOIN</button><button class="btn" onclick="showTab('login')">LOGIN</button></div>

<div id="join" class="form">
<label>Username</label><input id="ju" autocomplete="username" placeholder="tiki123">
<label>Nama</label><input id="jn" placeholder="Nama kamu">
<label>Password</label><input id="jp" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter">
<button id="joinBtn" class="btn" onclick="join()">JOIN TIKI TIKI GANK</button>
<p id="jm" class="msg"></p>
</div>

<div id="login" class="form hidden">
<label>Username</label><input id="lu" autocomplete="username" placeholder="Username">
<label>Password</label><input id="lp" type="password" autocomplete="current-password" placeholder="Password">
<button id="loginBtn" class="btn" onclick="login()">LOGIN</button>
<p id="lm" class="msg"></p>
</div></section>

<section class="section"><h2>🎁 Keuntungan Member</h2><div class="grid" id="benefits"></div></section>
<script>
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dots(){return '<span class="spinner"><i></i><i></i><i></i></span>'}
async function load(){try{let x=await(await fetch("/.netlify/functions/api?action=public")).json();intro.textContent=x.site.intro;benefits.innerHTML=x.site.benefits.map(v=>`<div class="card"><h3>⭐</h3><p>${esc(v)}</p></div>`).join("")}catch(e){intro.textContent="Selamat datang di komunitas Tiki Tiki Gank."}}
function showTab(x){join.classList.toggle("hidden",x!=="join");login.classList.toggle("hidden",x!=="login")}
async function join(){
 const btn=joinBtn;btn.classList.add("loading");btn.innerHTML=dots()+"JOINING...";jm.textContent="Mendaftarkan akun...";
 try{
  const r=await fetch("/.netlify/functions/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"join",username:ju.value,name:jn.value,memberPassword:jp.value})});
  const x=await r.json();
  if(r.ok){jm.textContent="✅ Berhasil join!";localStorage.setItem("tikiMemberId",x.member.id);setTimeout(()=>location.href="/member.html",300)}
  else{jm.textContent="❌ "+(x.error||"Pendaftaran gagal.");btn.classList.remove("loading");btn.textContent="JOIN TIKI TIKI GANK"}
 }catch(e){jm.textContent="❌ Tidak dapat terhubung ke server.";btn.classList.remove("loading");btn.textContent="JOIN TIKI TIKI GANK"}
}
async function login(){
 const btn=loginBtn;btn.classList.add("loading");btn.innerHTML=dots()+"LOGGING IN...";lm.textContent="Memeriksa akun...";
 try{
  const r=await fetch("/.netlify/functions/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",username:lu.value,memberPassword:lp.value})});
  const x=await r.json();
  if(r.ok){lm.textContent="✅ Login berhasil!";localStorage.setItem("tikiMemberId",x.member.id);setTimeout(()=>location.href="/member.html",300)}
  else{lm.textContent="❌ "+(x.error||"Login gagal.");btn.classList.remove("loading");btn.textContent="LOGIN"}
 }catch(e){lm.textContent="❌ Tidak dapat terhubung ke server.";btn.classList.remove("loading");btn.textContent="LOGIN"}
}
load();
</script>
</body></html>
